name: release

# Per ADR-022, bc-base rebuilds are driven by shopsystem-bc-launcher's own
# centralized scheduled poll, not by a per-repo emit from this workflow on
# release. This workflow therefore performs no cross-repo dispatch; the
# version-tag trigger is retained as the release hook for in-repo steps.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Mark release
        run: echo "shopsystem-scenarios ${GITHUB_REF_NAME} released"
