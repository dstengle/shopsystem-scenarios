[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scenarios"
version = "0.3.1"
description = "Scenario domain logic — canonicalization and hashing of Gherkin scenarios. Separate from the messaging catalog: messages happen to carry scenarios, but hash discipline is a scenario concern."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Stenglein"}]
# gherkin-official and pyyaml are RUNTIME dependencies: `scenarios validate`
# parses feature files with the off-the-shelf @cucumber/gherkin port at
# runtime (ADR-056), and the @bc/@origin resolution roots (later slices) read
# a bc-manifest.yaml. They are kept in `dev` too so the existing pinned test
# extras keep installing them for the test suite.
dependencies = [
    "gherkin-official",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-bdd>=7",
    "gherkin-official",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/dstengle/shopsystem-product"
Repository = "https://github.com/dstengle/shopsystem-scenarios"

[project.scripts]
scenarios = "scenarios.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
